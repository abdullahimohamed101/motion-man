# MotionMan UI theme (spec §9, docs/design/ui.md): near-black surfaces, grey type, a calm bone primary action.
# Acid lime (#E4F222) is a signal only (focus ring, active tab, progress) and lives in motionman/ui/style.py,
# as do the tokens config can't express (cards, top bar, page header, type scale details).
[theme]
base = "dark"
primaryColor = "#E8E9E3"            # bone: the one primary action per view, selection and slider thumbs
backgroundColor = "#08090A"         # void: canvas
secondaryBackgroundColor = "#161718" # obsidian: inputs and recessed controls
textColor = "#D0D6E0"               # mist: body text; headings are forced to paper in style.py
borderColor = "#23252A"             # graphite hairline
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
baseFontSize = 14
baseFontWeight = 400
codeFont = "'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
codeFontSize = "12px"
codeBackgroundColor = "#161718"
headingFont = "Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]  # h2 = page title, h4 = card title
headingFontWeights = [590, 590, 590, 510, 510, 510]
metricValueFontSize = "24px"
metricValueFontWeight = 510
linkColor = "#D0D6E0"
dataframeBorderColor = "#23252A"
dataframeHeaderBackgroundColor = "#0F1011"
redColor = "#EB5757"
greenColor = "#27A644"
yellowColor = "#E4F222"
blueColor = "#02B8CC"
violetColor = "#6366F1"
grayColor = "#8A8F98"
grayBackgroundColor = "#161718"

[theme.sidebar]
backgroundColor = "#0F1011"
secondaryBackgroundColor = "#161718"

[server]
headless = true
address = "localhost"   # a local tool: never listen on the network
port = 8501
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
